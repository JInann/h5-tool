<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>WebView 调试 · DevTools</title>
<style>
  :root {
    --bg: #0f1117; --panel: #1a1d27; --panel2: #232734; --border: #2e3342;
    --text: #e6e8ee; --muted: #8a91a3; --accent: #4c8dff; --accent2: #3a6fd4;
    --ok: #3ecf8e; --err: #ff5c6c;
  }
  * { box-sizing: border-box; }
  body {
    margin: 0; font: 14px/1.5 -apple-system, "PingFang SC", "Segoe UI", sans-serif;
    background: var(--bg); color: var(--text);
    height: 100vh; display: flex; flex-direction: column; overflow: hidden;
  }
  header {
    padding: 12px 20px; background: var(--panel); border-bottom: 1px solid var(--border);
    display: flex; align-items: center; gap: 14px; flex-shrink: 0;
  }
  header h1 { font-size: 16px; margin: 0; font-weight: 600; }
  .link { color: var(--accent); text-decoration: none; font-size: 13px; margin-left: auto; }
  .layout {
    flex: 1; min-height: 0;
    display: grid; grid-template-columns: 400px 1fr; gap: 0;
  }
  .panel { overflow-y: auto; padding: 14px; border-right: 1px solid var(--border); }
  .section { margin-bottom: 18px; }
  .section h2 {
    font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
    margin: 0 0 10px; display: flex; align-items: center; gap: 8px;
  }
  .dot { width: 8px; height: 8px; border-radius: 50%; background: var(--muted); display: inline-block; }
  .dot.on { background: var(--ok); }
  /* 设备切换按钮组（平铺，点击切换） */
  .device-tabs { display: flex; gap: 6px; flex-wrap: wrap; align-items: center; max-width: 520px; }
  .device-tab {
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 7px; padding: 4px 12px; font: inherit; font-size: 12.5px;
    cursor: pointer; white-space: nowrap; transition: all .15s;
  }
  .device-tab:hover { border-color: var(--accent); color: var(--accent); }
  .device-tab.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .device-tab .sub { opacity: .72; font-size: 11px; margin-left: 6px; font-variant-numeric: tabular-nums; }
  .device-tab.active .sub { opacity: .85; }
  .tab-empty { color: var(--muted); font-size: 12px; }
  .target {
    background: var(--panel); border: 1px solid var(--border); border-radius: 8px;
    padding: 10px 12px; margin-bottom: 8px;
  }
  .t-title { font-size: 13px; font-weight: 500; display: flex; align-items: center; gap: 8px; }
  .badge {
    font-size: 11px; padding: 1px 7px; border-radius: 20px;
    background: var(--panel2); border: 1px solid var(--border); color: var(--muted); flex-shrink: 0;
  }
  .t-url {
    font-size: 12px; color: var(--muted); word-break: break-all; margin: 5px 0 8px;
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
  }
  .ops { display: flex; gap: 8px; }
  button {
    background: var(--accent); color: #fff; border: none; border-radius: 7px;
    padding: 7px 13px; font: inherit; font-weight: 500; cursor: pointer;
  }
  button:hover { background: var(--accent2); }
  button.ghost { background: var(--panel2); border: 1px solid var(--border); }
  button.ghost:hover { background: var(--border); }
  .err { font-size: 12px; color: var(--err); }
  .empty { font-size: 12px; color: var(--muted); }
  .hint { font-size: 12px; color: var(--muted); line-height: 1.7; margin-top: 4px; }
  code { background: var(--panel2); padding: 1px 5px; border-radius: 4px; font-size: 11.5px; }
  /* 快捷修改地址（吸底常驻） */
  .quick-nav {
    position: sticky; bottom: 0; z-index: 5;
    background: var(--bg);
    border-top: 1px solid var(--border);
    margin: 16px -14px 0; padding: 10px 14px 4px;
  }
  .quick-nav h2 {
    font-size: 12px; color: var(--muted); text-transform: uppercase; letter-spacing: .5px;
    margin: 0 0 8px; font-weight: 600;
  }
  .qn-row { display: flex; gap: 8px; }
  .qn-row input {
    flex: 1; min-width: 0; width: 100%;
    background: var(--panel2); border: 1px solid var(--border); color: var(--text);
    border-radius: 6px; padding: 5px 9px; font: inherit; font-size: 12px; outline: none;
  }
  .qn-row input:focus { border-color: var(--accent); }
  .qn-row button { padding: 5px 12px; font-size: 12px; border-radius: 6px; }
  .quick-nav .msg { font-size: 11px; margin-top: 6px; min-height: 14px; color: var(--muted); }
  .quick-nav .msg.ok { color: var(--ok); }
  .quick-nav .msg.err { color: var(--err); }
  #view { display: flex; flex-direction: column; min-height: 0; }
  #viewInfo {
    padding: 10px 16px; background: var(--panel); border-bottom: 1px solid var(--border);
    font-size: 12px; color: var(--muted); display: flex; align-items: center; gap: 10px;
    flex-shrink: 0; word-break: break-all;
  }
  #viewInfo b { color: var(--text); font-weight: 500; }
  iframe { flex: 1; width: 100%; border: none; background: #fff; }
</style>
</head>
<body>
<header>
  <h1>WebView 调试 · 复用 Chrome DevTools</h1>
  <div class="device-tabs" id="deviceTabs" title="点击切换要调试的设备"><span class="tab-empty">加载中…</span></div>
  <a class="link" href="/">← 返回控制台</a>
</header>
<div class="layout">
  <div class="panel">
    <div class="section">
      <h2><span class="dot" id="dotPhone"></span>手机 WebView</h2>
      <div id="phoneList"></div>
    </div>
    <div class="hint">
      点「内嵌打开」在右侧使用完整 DevTools（console / sources 断点 / network / storage / elements）；<br>
      「新窗口」独立打开。<br>
      手机 WebView 需 App 开启 setWebContentsDebuggingEnabled(true)。
    </div>
    <!-- 快捷修改地址（吸底） -->
    <div class="quick-nav">
      <h2>快捷修改地址</h2>
      <div class="qn-row">
        <input id="qnInput" list="qnHistory" placeholder="http://{ip}:5173/xx.html  或 https://example.com" />
        <button id="qnSend">发送</button>
      </div>
      <div class="msg" id="qnMsg"></div>
      <div class="hint">回车发送；<code>{ip}</code> 自动替换为本机 IP，输入与发送历史自动保存。</div>
      <datalist id="qnHistory"></datalist>
    </div>
  </div>
  <div id="view">
    <div id="viewInfo">选择一个目标开始调试…</div>
    <iframe id="frame" hidden></iframe>
  </div>
</div>

<script src="config.js"></script>
<script>
// 后端地址解析（与 app.js 保持一致）：config.js > localStorage > URL 参数
const CFG = window.H5TOOL_CONFIG || {};
const LS_BACKEND = "h5tool.backend";
function resolveBackend() {
  const q = new URLSearchParams(location.search).get("backend");
  if (q) { try { localStorage.setItem(LS_BACKEND, q); } catch (e) {} return q.replace(/\/+$/, ""); }
  const ls = localStorage.getItem(LS_BACKEND);
  if (ls) return ls.replace(/\/+$/, "");
  return (CFG.backend || "").replace(/\/+$/, "");
}
const API_BASE = resolveBackend();
const apiUrl = (path) => API_BASE + path;
function targetSpaceOf(url) {
  try {
    const h = new URL(url).hostname;
    if (h === "127.0.0.1" || h === "localhost" || h === "::1" || h === "[::1]") return "loopback";
    if (h.startsWith("10.") || h.startsWith("192.168.") ||
        /^172\.(1[6-9]|2\d|3[01])\./.test(h) || h.startsWith("169.254.") ||
        h.endsWith(".local")) return "local";
    return "public";
  } catch (e) { return "public"; }
}
const fetchOpts = (opts) => Object.assign({}, opts, { targetAddressSpace: targetSpaceOf(API_BASE) });

// 设备选择：URL ?device= 或 localStorage，多 tab 各选各的
const LS_DEVICE = "h5tool.device";
let device = new URLSearchParams(location.search).get("device") ||
             (() => { try { return localStorage.getItem(LS_DEVICE); } catch (e) { return null; } })();
const apiUrlDev = (path) => device
  ? apiUrl(path) + (path.includes("?") ? "&" : "?") + "device=" + encodeURIComponent(device)
  : apiUrl(path);

const targets = {};
const $ = (id) => document.getElementById(id);

function escapeHtml(s) {
  return String(s ?? "").replace(/[&<>"']/g, (c) => ({
    "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;",
  }[c]));
}
function truncate(s, n) {
  s = String(s ?? "");
  return s.length > n ? s.slice(0, n) + "…" : s;
}

async function loadDevices() {
  const box = $("deviceTabs");
  try {
    const r = await fetch(apiUrl("/api/devices"), fetchOpts());
    const data = await r.json();
    if (!data.devices || !data.devices.length) {
      box.innerHTML = '<span class="tab-empty">无设备</span>';
      return;
    }
    let keep = device;
    if (!data.devices.some((d) => d.serial === keep)) keep = data.default || data.devices[0].serial;
    box.innerHTML = data.devices
      .map((d) => {
        const model = (d.model || "").replace(/_/g, " ") || "Android";
        const active = d.serial === keep ? " active" : "";
        return `<button class="device-tab${active}" data-serial="${d.serial}" title="序列号：${d.serial}">${model}<span class="sub">${d.serial}</span></button>`;
      })
      .join("");
    if (keep !== device) { device = keep; try { localStorage.setItem(LS_DEVICE, keep); } catch (e) {} }
  } catch (e) {
    box.innerHTML = '<span class="tab-empty">后端未连接</span>';
  }
}

async function load(showLoading) {
  let data = { phone: [], phone_error: null };
  try {
    // 仅切换设备时显示"加载中"，轮询刷新（每 5s）不闪
    if (showLoading) {
      $("phoneList").innerHTML = '<div class="empty">加载中…</div>';
    }
    const r = await fetch(apiUrlDev("/api/webview-targets"), fetchOpts());
    data = await r.json();
  } catch (e) {
    data.phone_error = "请求后端失败：" + e.message;
  }
  renderList("phoneList", "dotPhone", data.phone, data.phone_error);
}

function renderList(listId, dotId, list, err) {
  const el = $(listId);
  const dot = $(dotId);
  dot.className = "dot" + (list && list.length ? " on" : "");
  if (err) { el.innerHTML = '<div class="err">' + escapeHtml(err) + "</div>"; return; }
  if (!list || !list.length) { el.innerHTML = '<div class="empty">无可调试目标</div>'; return; }
  el.innerHTML = list
    .filter((t) => t.ws)
    .map((t) => {
      targets[t.id] = t;
      return (
        '<div class="target">' +
          '<div class="t-title"><span class="badge">' + escapeHtml(t.type || "page") + "</span>" +
            escapeHtml(truncate(t.title, 40)) + "</div>" +
          '<div class="t-url">' + escapeHtml(t.url || "") + "</div>" +
          '<div class="ops">' +
            '<button onclick="openTarget(\'' + t.id + '\')">内嵌打开</button>' +
            '<button class="ghost" onclick="openWindow(\'' + t.id + '\')">新窗口</button>' +
          "</div>" +
        "</div>"
      );
    })
    .join("");
}

function devtoolsUrl(t) {
  // devtools-frontend 会自己给 ws 参数加 ws:// 前缀（Connections.ts），所以不带协议。
  // 走 h5-tool 本地 WebSocket 代理 /cdp-ws/<targetId>：WebView CDP server 校验 Origin，
  // 浏览器 iframe 直连 ws://127.0.0.1:9222 会被 403，代理用无 Origin 连接转发。
  // 后端地址从 config.js 取（分离模式下仍是使用者本机 127.0.0.1:12787）。
  const qs = device ? "?device=" + encodeURIComponent(device) : "";
  const bare = API_BASE.replace(/^https?:\/\//, "") + "/cdp-ws/" + t.id + qs;
  const panel = CFG.devtoolsPanel || "/devtools/inspector.html";
  return panel + "?ws=" + encodeURIComponent(bare);
}

function openTarget(id) {
  const t = targets[id];
  if (!t) return;
  const frame = $("frame");
  frame.hidden = false;
  $("viewInfo").innerHTML =
    "<b>" + escapeHtml(truncate(t.title, 30)) + "</b> " + escapeHtml(t.url || "");
  frame.src = devtoolsUrl(t);
}

function openWindow(id) {
  const t = targets[id];
  if (!t) return;
  window.open(devtoolsUrl(t), "_blank");
}

// 立即把设备按钮高亮切到指定 serial（纯 DOM 操作，不等后端）
function setActiveTab(serial) {
  document.querySelectorAll(".device-tab").forEach((b) => {
    b.classList.toggle("active", b.dataset.serial === serial);
  });
}

$("deviceTabs").addEventListener("click", (e) => {
  const btn = e.target.closest(".device-tab");
  if (!btn) return;
  const next = btn.dataset.serial || null;
  if (next === device) return;
  device = next;
  try { localStorage.setItem(LS_DEVICE, next || ""); } catch (err) {}
  setActiveTab(next);  // 先切高亮，立即反馈
  load(true);          // 切换设备：显示"加载中"并异步刷新
});

loadDevices();
load();
setInterval(load, 5000); // 目标列表每 5s 刷新（WebView 页面切换场景）
</script>

<script>
// ---------- 快捷修改地址（吸底常驻，独立于控制台模块1） ----------
(() => {
  const LS_ROWS = "h5tool.devtools.urlRows";
  const LS_HISTORY = "h5tool.devtools.urlHistory";
  const qnInput = document.getElementById("qnInput");
  const qnSend = document.getElementById("qnSend");
  const qnMsg = document.getElementById("qnMsg");

  function setMsg(text, ok) {
    qnMsg.textContent = text;
    qnMsg.className = "msg" + (ok ? " ok" : " err");
  }

  // 历史记录（datalist 提示 + 发送成功后入列）
  let urlHistory = [];
  try { urlHistory = JSON.parse(localStorage.getItem(LS_HISTORY)) || []; } catch (e) {}
  function renderHistory() {
    document.getElementById("qnHistory").innerHTML = urlHistory
      .map((u) => '<option value="' + u.replace(/"/g, "&quot;") + '"></option>')
      .join("");
  }
  function pushHistory(url) {
    urlHistory = [url, ...urlHistory.filter((u) => u !== url)].slice(0, 30);
    try { localStorage.setItem(LS_HISTORY, JSON.stringify(urlHistory)); } catch (e) {}
    renderHistory();
  }

  // 恢复上次未发送的输入
  try {
    const saved = JSON.parse(localStorage.getItem(LS_ROWS));
    if (Array.isArray(saved) && saved.length && saved[0]) qnInput.value = saved[0];
  } catch (e) {}

  qnInput.addEventListener("input", () => {
    try { localStorage.setItem(LS_ROWS, JSON.stringify([qnInput.value])); } catch (e) {}
  });
  qnInput.addEventListener("keydown", (e) => { if (e.key === "Enter") send(); });

  async function send() {
    const url = qnInput.value.trim();
    if (!url) return setMsg("请输入链接", false);
    qnSend.disabled = true;
    setMsg("发送中…", true);
    try {
      const res = await fetch(apiUrlDev("/api/navigate"), fetchOpts({
        method: "POST", headers: { "Content-Type": "application/json" },
        body: JSON.stringify({ url }),
      }));
      const ct = res.headers.get("content-type") || "";
      const data = ct.includes("application/json") ? await res.json() : null;
      if (!res.ok || (data && data.error)) throw new Error((data && data.error) || ("HTTP " + res.status));
      let msg = "✓ 已发送到手机：" + data.url;
      if (data.replaced_ip) msg += "（已把 {ip} 替换为 " + data.ip + "）";
      setMsg(msg, true);
      pushHistory(url); // 历史存原始输入（含 {ip} 占位符），IP 会变，存实际 IP 没意义
    } catch (e) {
      setMsg("✗ " + e.message, false);
    } finally {
      qnSend.disabled = false;
    }
  }
  qnSend.addEventListener("click", send);
  renderHistory();
})();
</script>
</body>
</html>
